  body.modal-open { overflow: hidden; }

  /* velo crema para que los lomos se lean sobre el estampado */
  .veil {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 75% 55% at 50% 50%, rgba(255,251,245,0.75) 0%, rgba(255,251,245,0.45) 60%, rgba(255,251,245,0) 100%);
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 1500px;
    margin: 0 auto;
    padding: clamp(32px, 5vw, 64px) 16px clamp(48px, 6vw, 80px);
    text-align: center;
  }

  .kicker {
    margin: 0 0 14px;
    color: #B59868;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-family: 'Playfair Display', 'Times New Roman', serif;
    font-weight: 700;
    font-size: clamp(34px, 5vw, 64px);
    line-height: 1.05;
    color: #041E42;
  }
  h1 span { color: #B59868; }
  .dates {
    display: inline-block;
    margin: 18px 0 6px;
    padding: 0 22px 8px;
    border-bottom: 1px solid #B59868;
    color: #B59868;
    font-size: 13px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .motto {
    margin: 10px 0 0;
    font-family: 'Playfair Display', 'Times New Roman', serif;
    font-size: clamp(13px, 1.3vw, 16px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #041E42;
  }

  /* ---------- Una sola estantería ---------- */
  .library-scroll {
    margin: clamp(40px, 5vw, 64px) -16px 0;
    padding: 30px 16px 8px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    scrollbar-color: #B59868 rgba(181,152,104,0.15);
  }
  .library {
    --bw: clamp(34px, calc((100vw - 32px - 180px) / 19), 68px);
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: flex-end;
    position: relative;
    width: max-content;
    min-width: 100%;
    margin: 0 auto;
  }

  .section { display: flex; flex-direction: column; align-items: stretch; }
  .section:first-child .ledge { border-radius: 3px 0 0 4px; }
  .section:last-child .ledge { border-radius: 0 3px 4px 0; }

  /* etiqueta debajo del estante, alineada en una sola línea */
  .section-label {
    margin: 14px 4px 0;
    padding-top: 10px;
    border-top: 1px solid #B59868;
    color: #041E42;
    font-family: 'Playfair Display', 'Times New Roman', serif;
    font-weight: 600;
    font-size: clamp(10px, 0.85vw, 12.5px);
    line-height: 1.3;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
  }
  .section-label small {
    display: block;
    color: #B59868;
    font-family: 'Inter', Arial, sans-serif;
    font-weight: 600;
    font-size: 0.78em;
    letter-spacing: 0.22em;
  }

  .shelf {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 1px;
    padding: 0 9px;
  }
  /* sombra de contacto de los libros sobre el estante */
  .shelf::after {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: -4px;
    height: 14px;
    background: radial-gradient(ellipse 50% 100% at 50% 0%, rgba(4,30,66,0.45), rgba(4,30,66,0) 80%);
    pointer-events: none;
  }

  .pair { display: flex; align-items: flex-end; gap: 1px; }

  /* ---------- Libro realista ---------- */
  .book {
    --s: 1;
    position: relative;
    z-index: 1;
    flex: 0 0 auto;
    width: var(--bw);
    height: calc(var(--bw) * 4.715 * var(--s));
    padding: 0;
    border: 0;
    border-radius: 5px 5px 2px 2px / 7px 7px 2px 2px;
    background: #041E42;
    cursor: pointer;
    overflow: hidden;
    transform-origin: bottom center;
    box-shadow:
      -2px 0 5px rgba(4,30,66,0.55),
      2px 0 5px rgba(4,30,66,0.55),
      0 14px 20px rgba(4,30,66,0.35);
    transition: transform 0.3s cubic-bezier(.22,1,.36,1), filter 0.3s ease;
    animation: rise 0.8s cubic-bezier(.22,1.12,.36,1) both;
    -webkit-tap-highlight-color: transparent;
  }
  .book img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }
  /* textura de tela */
  .book::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.6;
    background:
      repeating-linear-gradient(90deg, rgba(4,30,66,0.10) 0 1px, rgba(4,30,66,0) 1px 2px),
      repeating-linear-gradient(0deg, rgba(255,251,245,0.012) 0 1px, rgba(255,251,245,0) 1px 2px);
  }
  /* volumen: lomo redondeado, brillo, cabezada y pie */
  .book::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    border-radius: inherit;
    background:
      linear-gradient(90deg,
        rgba(4,30,66,0.8) 0%,
        rgba(4,30,66,0.3) 5%,
        rgba(255,251,245,0.05) 15%,
        rgba(255,251,245,0.11) 25%,
        rgba(255,251,245,0.03) 40%,
        rgba(255,251,245,0) 55%,
        rgba(4,30,66,0.18) 74%,
        rgba(4,30,66,0.5) 93%,
        rgba(4,30,66,0.85) 100%),
      linear-gradient(180deg,
        rgba(255,251,245,0.16) 0%,
        rgba(4,30,66,0.55) 1.6%,
        rgba(4,30,66,0) 4%,
        rgba(4,30,66,0) 95%,
        rgba(4,30,66,0.6) 98.4%,
        rgba(255,251,245,0.08) 100%);
    box-shadow:
      inset 0 1px 0 rgba(181,152,104,0.45),
      inset 1px 0 0 rgba(255,251,245,0.06);
  }
  .book:hover, .book:focus-visible {
    transform: translateY(-10px) scaleY(0.985);
    filter: brightness(1.15);
    outline: none;
    z-index: 4;
  }
  .book:focus-visible { box-shadow: 0 0 0 2px #B59868, 0 14px 20px rgba(4,30,66,0.35); }

  @keyframes rise {
    0% { transform: translateY(-120%); opacity: 0; }
    60% { opacity: 1; }
    78% { transform: translateY(3%); }
    100% { transform: translateY(0); opacity: 1; }
  }

    width: 100%;
    height: 26px;

  .hint {
    margin-top: clamp(40px, 5vw, 60px);
    color: #041E42;
    opacity: 0.7;
    font-size: 12.5px;
    letter-spacing: 0.04em;
  }
  .hint b { color: #B59868; font-weight: 600; }

  .swipe { display: none; }
  @media (max-width: 900px) { .swipe { display: inline; } .library { justify-content: flex-start; } }
  @media (max-width: 520px) {
    .shelf { gap: 4px; padding: 0 6px; }
  }

  /* ---------- Ventana del libro ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(4,30,66,0.86);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }

  .panel {
    position: fixed;
    z-index: 60;
    left: 50%;
    top: 50%;
    width: min(92vw, 920px);
    height: min(86vh, 620px);
    transform: translate(-50%, -46%) scale(0.96);
    opacity: 0;
    pointer-events: none;
    display: flex;
    border: 1px solid #B59868;
    border-radius: 12px;
    background: #041E42;
    box-shadow: 0 40px 80px rgba(4,30,66,1);
    overflow: hidden;
    transition: opacity 0.35s ease, transform 0.45s cubic-bezier(.22,1,.36,1);
  }
  .panel.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

  .panel-spine {
    flex: 0 0 auto;
    height: 100%;
    aspect-ratio: 200 / 943;
    background: #041E42;
  }
  .panel-spine { position: relative; box-shadow: 6px 0 14px rgba(4,30,66,0.9); }
  .panel-spine img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .panel-spine::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(4,30,66,0.7) 0%, rgba(255,251,245,0.14) 22%, rgba(255,251,245,0) 50%, rgba(4,30,66,0.6) 100%); }

  .panel-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;

(function () {
  const library = document.getElementById('library');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const frame = document.getElementById('frame');
  const viewerExternal = document.getElementById('viewerExternal');
  let delay = 0.15;
  let bookCount = 0;
  const ALTURAS = [1, 0.975, 0.99, 0.96, 0.985, 0.97, 1, 0.955];

  function makeBook(libro, seccion) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'book';
    b.style.animationDelay = delay.toFixed(2) + 's';
    delay += 0.05;
    b.style.setProperty('--s', ALTURAS[bookCount++ % ALTURAS.length]);
    b.setAttribute('aria-label', 'Abrir guía de ' + libro.nombre);
    const img = document.createElement('img');
    img.src = LOMOS[libro.id];
    img.alt = '';
    b.appendChild(img);
    b.addEventListener('click', () => openBook(libro, seccion));
    return b;
  }

  SECCIONES.forEach(sec => {
    const wrap = document.createElement('section');
    wrap.className = 'section';
    const label = document.createElement('div');
    label.className = 'section-label';
    const partes = sec.nombre.replace(/^SGA\s*/, '');
    label.innerHTML = '<small>SGA</small>';
    label.appendChild(document.createTextNode(partes));
    const shelf = document.createElement('div');
    shelf.className = 'shelf';
    sec.libros.forEach(l => {
      if (l.par) {
        const pair = document.createElement('div');
        pair.className = 'pair';
        l.par.forEach(p => pair.appendChild(makeBook(p, sec.nombre)));
        shelf.appendChild(pair);
      } else {
        shelf.appendChild(makeBook(l, sec.nombre));
      }
    });
    const ledge = document.createElement('div');
    ledge.className = 'ledge';
    wrap.append(shelf, ledge, label);
    library.appendChild(wrap);
  });

  // la veta de la madera continúa de una sección a la siguiente
  function alignWood() {
    library.querySelectorAll('.section').forEach(sec => {
      sec.querySelector('.ledge').style.backgroundPosition = '0 0, ' + (-sec.offsetLeft) + 'px 0';
    });
  }
  alignWood();
  window.addEventListener('resize', alignWood);
  window.addEventListener('load', alignWood);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignWood);
  if ('ResizeObserver' in window) new ResizeObserver(alignWood).observe(library);

  function openBook(libro, seccion) {
    document.getElementById('pSpine').src = LOMOS[libro.id];
    document.getElementById('pCat').textContent = seccion;
    document.getElementById('pName').textContent = libro.nombre;
    document.getElementById('pTopic').textContent = libro.tema;
    const tags = document.getElementById('pTags');
    tags.innerHTML = '';
    libro.tags.forEach(t => {
      const s = document.createElement('span');
      s.className = 'tag';
      s.textContent = t;
      tags.appendChild(s);
    });
    const actions = document.getElementById('pActions');
    actions.innerHTML = '';
    if (libro.url) {
      const read = document.createElement('button');
      read.className = 'btn';
      read.textContent = 'Leer la guía';
      read.addEventListener('click', () => {
        frame.src = libro.url;
        viewerExternal.href = libro.url;
        panel.classList.add('reading');
      });
      const ext = document.createElement('a');
      ext.className = 'btn ghost';
      ext.href = libro.url;
      ext.target = '_blank';
      ext.rel = 'noopener';
      ext.textContent = 'Abrir en pestaña nueva ↗';
      actions.append(read, ext);
    } else {
      const s = document.createElement('span');
      s.className = 'soon';
      s.textContent = 'Guía próximamente disponible.';
      actions.appendChild(s);
    }
    overlay.classList.add('active');
    panel.classList.add('active');
    document.body.classList.add('modal-open');
  }

  function closeBook() {
    panel.classList.remove('active', 'reading');
    overlay.classList.remove('active');
    document.body.classList.remove('modal-open');
    setTimeout(() => frame.removeAttribute('src'), 300);
  }

  document.getElementById('closeBtn').addEventListener('click', closeBook);
  overlay.addEventListener('click', closeBook);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBook(); });
})();
</script>
</body>
</html>
